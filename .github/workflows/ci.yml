name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rest-otm/receipt-core build
      - run: pnpm --filter @rest-otm/license build
      - run: pnpm -r run typecheck
      - run: pnpm --filter @rest-otm/license test
      - run: pnpm --filter @rest-otm/api test
      - run: pnpm --filter @rest-otm/print-agent test
      - run: pnpm run test:release
