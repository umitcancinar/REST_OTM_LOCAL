name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Prisma Client postinstall'e güvenilmez: CI'nin temiz checkout'unda
      # generated model/type'lar yoktur. Typecheck ve API build'den önce
      # şemadaki client'ı deterministik olarak üret.
      - run: DATABASE_URL=postgresql://rest_otm:rest_otm@127.0.0.1:5432/rest_otm pnpm --filter @rest-otm/api exec prisma generate
      - run: pnpm --filter @rest-otm/receipt-core build
      - run: pnpm --filter @rest-otm/license build
      - run: pnpm -r run typecheck
      - run: pnpm --filter @rest-otm/license test
      - run: pnpm --filter @rest-otm/api test
      - run: pnpm --filter @rest-otm/marketing test
      - run: pnpm --filter @rest-otm/superadmin test
      - run: pnpm --filter @rest-otm/print-agent test
      - run: pnpm --filter @rest-otm/gateway test
      - run: pnpm --filter @rest-otm/menu test
      - run: pnpm --filter @rest-otm/waiter test
      - run: pnpm run test:release
      - run: pnpm run test:windows
      - run: node --test runtime/windows-host/tests/source-policy.test.mjs
      - run: DATABASE_URL=postgresql://rest_otm:rest_otm@127.0.0.1:5432/rest_otm pnpm run release:build:api
      - run: pnpm run release:audit:local
      - run: pnpm run release:audit:cloud
      - run: pnpm --filter @rest-otm/admin build
      - run: pnpm --filter @rest-otm/waiter build
      - run: pnpm --filter @rest-otm/marketing build
      - run: pnpm --filter @rest-otm/superadmin build
      - run: CLOUD_MENU_API_URL=https://cloud.example.invalid/api MENU_BASE_PATH= pnpm --filter @rest-otm/menu build
      - run: CLOUD_MENU_API_URL=https://cloud.example.invalid/api MENU_BASE_PATH=/menu pnpm --filter @rest-otm/menu build
