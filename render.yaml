services:
  - type: web
    name: rest-otm-api
    plan: free
    env: node
    # Always compile the API on Render. Running a checked-in dist/ directory
    # without this step can silently deploy stale printing/layout behavior.
    buildCommand: npm install -g pnpm && pnpm install --prod=false --no-frozen-lockfile && pnpm --filter @rest-otm/receipt-core build && pnpm --filter @rest-otm/license build && pnpm --filter @rest-otm/api build
    startCommand: cd apps/api && pnpm run start:cloud
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUNTIME_MODE
        value: cloud
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: LICENSE_PRIVATE_KEY
        sync: false
      - key: UPDATE_SIGNING_PRIVATE_KEY
        sync: false
      - key: UPDATE_SIGNING_PUBLIC_KEY
        sync: false
      - key: UPDATE_ARTIFACT_ALLOWED_ORIGINS
        sync: false
      # DIKKAT: Bu isimler env.shared.ts/env.cloud.ts icinde okunan isimlerle
      # birebir ayni olmak zorunda. Daha once burada JWT_SECRET / ADMIN_SECRET
      # yaziyordu; kod ise JWT_ACCESS_SECRET / JWT_REFRESH_SECRET okuyordu.
      # Isimler tutmadigi icin API, kaynak kodda yazili varsayilan sirla
      # calisiyordu. Artik eksik/zayif sirda surec hic baslamiyor.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # Panel ve garson paneli adresleri, virgulle ayrilmis.
      - key: CORS_ORIGIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false

  - type: web
    name: rest-otm-marketing
    plan: free
    env: node
    buildCommand: npm install -g pnpm && pnpm install --prod=false --no-frozen-lockfile && pnpm --filter @rest-otm/marketing build
    startCommand: cd apps/marketing && pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Demo talep formunun teslim ucu. Tanimlanmazsa basvurular yalnizca
      # sunucu logunda gorunur (bkz. src/app/api/demo-request/route.ts).
      # Slack "Incoming Webhook" veya Make/n8n/Zapier ucu buraya yazilabilir.
      - key: DEMO_REQUEST_WEBHOOK_URL
        sync: false
