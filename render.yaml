services:
  - type: web
    name: rest-otm-api
    plan: free
    env: node
    # Always compile the API on Render. Running a checked-in dist/ directory
    # without this step can silently deploy stale printing/layout behavior.
    buildCommand: npm install -g pnpm@9.15.0 && pnpm install --prod=false --frozen-lockfile && pnpm --filter @rest-otm/receipt-core build && pnpm --filter @rest-otm/license build && pnpm --filter @rest-otm/api build
    startCommand: cd apps/api && pnpm run start:cloud
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUNTIME_MODE
        value: cloud
      - key: PORT
        value: 10000
      # Render reverse proxy'sinin API'ye ulaşabilmesi için cloud dinlemesi.
      - key: BIND_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: LICENSE_PRIVATE_KEY
        sync: false
      - key: LICENSE_KEY_ACTIVE_PEPPER_VERSION
        sync: false
      - key: LICENSE_KEY_PEPPERS
        sync: false
      - key: MENU_PUBLIC_ID_SECRET
        sync: false
      - key: UPDATE_SIGNING_PRIVATE_KEY
        sync: false
      - key: UPDATE_SIGNING_PUBLIC_KEY
        sync: false
      - key: UPDATE_ARTIFACT_ALLOWED_ORIGINS
        sync: false
      # DIKKAT: Bu isimler env.shared.ts/env.cloud.ts icinde okunan isimlerle
      # birebir ayni olmak zorunda. Daha once burada JWT_SECRET / ADMIN_SECRET
      # yaziyordu; kod ise JWT_ACCESS_SECRET / JWT_REFRESH_SECRET okuyordu.
      # Isimler tutmadigi icin API, kaynak kodda yazili varsayilan sirla
      # calisiyordu. Artik eksik/zayif sirda surec hic baslamiyor.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # Panel ve garson paneli adresleri, virgulle ayrilmis.
      - key: CORS_ORIGIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      # Superadmin BFF ile AYNI, en az 32 karakterlik rastgele secret.
      # Browser'a acilmaz; MFA internal endpoint'lerini korur.
      - key: SUPERADMIN_BFF_SERVICE_SECRET
        sync: false
      # MFA kodlarinin PostgreSQL'deki HMAC ozeti icin API'ye ozel pepper.
      - key: SUPERADMIN_MFA_PEPPER
        sync: false
  - type: web
    name: rest-otm-marketing
    plan: free
    env: node
    # Marketing cloud-only bir Next.js uygulamasidir. Standalone artefact
    # tasimak yerine Render'in normal Next sunucusunu kullan; bu sayede
    # _next/static dosyalari ve PORT/host ayari tek yerde dogru kalir.
    buildCommand: npm install -g pnpm@9.15.0 && pnpm install --prod=false --frozen-lockfile && pnpm --filter @rest-otm/marketing build
    startCommand: pnpm --filter @rest-otm/marketing exec next start --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MARKETING_PUBLIC_URL
        value: https://www.restoranyonetim.com
      # The public site intentionally exposes no admin link. Operators who know
      # /login are redirected to the separately isolated control-plane UI.
      - key: SUPERADMIN_LOGIN_URL
        value: https://rest-otm-superadmin.onrender.com/login
      # Demo talebi e-posta doğrulaması: Resend API anahtarı ve doğrulanmış
      # sender adresi Render Secret olarak girilir; kaynak koda yazılmaz.
      - key: RESEND_API_KEY
        sync: false
      - key: DEMO_EMAIL_FROM
        sync: false
      - key: DEMO_NOTIFICATION_EMAIL
        sync: false
      - key: DEMO_VERIFICATION_SECRET
        sync: false
      # Cloudflare Turnstile ücretsiz bot koruması. Site key herkese açık,
      # secret key yalnızca sunucuda kalır. Production eksikse form fail-closed.
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_ALLOWED_HOSTNAMES
        value: restoranyonetim.com,www.restoranyonetim.com,rest-otm-marketing.onrender.com

  # Sadece lisans ve işletme yönetimi için bulut super-admin paneli.
  # Müşteri operasyonu/garson/kasa ekranı burada değil, kendi yerel ağında çalışır.
  - type: web
    name: rest-otm-superadmin
    plan: free
    env: node
    buildCommand: npm install -g pnpm@9.15.0 && pnpm install --prod=false --frozen-lockfile && pnpm --filter @rest-otm/superadmin build
    startCommand: pnpm --filter @rest-otm/superadmin exec next start --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # https://rest-otm-api.onrender.com/api örneği; Render dashboard'daki
      # API ana URL'si ile kesin değer girilir.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Sunucu tarafı BFF'in API origin'i; asla NEXT_PUBLIC_ olarak açılmaz.
      - key: REST_OTM_API_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SUPERADMIN_EMAIL_FROM
        sync: false
      - key: SUPERADMIN_SESSION_SECRET
        sync: false
      # rest-otm-api servisindeki degerle birebir AYNI olmalidir.
      - key: SUPERADMIN_BFF_SERVICE_SECRET
        sync: false
