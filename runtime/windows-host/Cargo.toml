[package]
name = "restotm-windows-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false

[workspace]
resolver = "2"

[lib]
name = "restotm_windows_host"
path = "src/lib.rs"

[[bin]]
name = "restotm-runtime-service"
path = "src/bin/runtime_service.rs"

[[bin]]
name = "restotm-installer-bootstrap"
path = "src/bin/installer_bootstrap.rs"

[[bin]]
name = "restotm-child-launcher"
path = "src/bin/child_launcher.rs"

[dependencies]
base64 = "0.22"
ctrlc = "3.4"
ed25519-dalek = "2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "=0.3.36", features = ["formatting", "parsing"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zeroize = "1.8"
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
